# Central pipeline configuration. Every stage reads this file through h1b.config,
# so changing a fiscal year or filter here changes it everywhere (CLI, Airflow, CI).

data:
  raw_dir: data/raw              # DOL .xlsx files go here (downloaded manually, see data/README.md)
  interim_dir: data/interim      # one Parquet per raw file, columns renamed to the canonical schema
  processed_dir: data/processed  # cleaned dataset + train/val splits
  holdout_dir: data/holdout      # isolated test split; only read during production validation
  reports_dir: reports           # JSON reports (ingestion validation, baseline metrics)

filters:
  visa_classes: ["H-1B"]                            # drop E-3 / H-1B1 filings
  case_statuses: ["CERTIFIED", "CERTIFIED-WITHDRAWN"]  # certified wages only; denied/withdrawn are unreliable
  min_annual_wage: 15000     # below this the wage unit was almost certainly mis-entered
  max_annual_wage: 1000000   # above this we treat the record as a data-entry error

# Temporal split on fiscal year (derived from DECISION_DATE). Years must not overlap.
split:
  train_years: [2022, 2023]
  val_years: [2024]
  test_years: [2025]

# FastAPI service (h1b.serve). The MLflow server address is NOT set here: it differs
# between a laptop and Docker, so it comes from the MLFLOW_TRACKING_URI environment variable.
serving:
  model_name: h1b-salary-model   # registry name agreed by the team
  model_alias: champion          # the API serves whichever version holds this alias

# AutoML training (h1b.train). The MLflow server address comes from MLFLOW_TRACKING_URI, not from here.
training:
  time_budget_s: 300            # FLAML search budget in seconds
  estimator_list: ["lgbm", "xgboost", "rf", "extra_tree"]
  metric: mse                   # on log_wage; RMSE is monotone in MSE, so the same model wins. We report log-RMSE ourselves
  max_train_rows: null          # e.g. 200000 for a quick smoke run
  wage_growth_adjust: false     # lift older train years to the latest year, add the yearly growth back in the model

seed: 42

monitoring:
  top_n: 50                # high-cardinality columns: keep the top N train values, rest -> "other"
  unseen_share_max:        # alert if the share of rows with a value never seen in train exceeds this
    soc_code: 0.02         # clean val: 0.000
    job_title: 0.22        # clean val: 0.156
    employer_name: 0.15    # clean val: 0.081

# Lint + unit tests on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -v

  # Builds the Docker image and runs the stack end to end on synthetic data:
  # /predict is 503 with no champion, then serves the registered baseline (scripts/docker_smoke.sh).
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install what the synthetic-data script needs
        run: pip install "pandas>=2.2,<3" pyarrow pyyaml numpy

      - name: Docker smoke test
        env:
          PYTHONPATH: src
        run: scripts/docker_smoke.sh
